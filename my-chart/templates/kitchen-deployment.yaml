apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose --file docker-compose-postgres.yml convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: kitchen
  name: kitchen
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kitchen
  template:
    metadata:
      annotations:
        kompose.cmd: kompose --file docker-compose-postgres.yml convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: kitchen
    spec:
      containers:
        - env:
            - name: KAFKA_HOST
              value: kafka
          image: kitchen
          name: kitchen
          ports:
            - containerPort: 8070
              protocol: TCP
      restartPolicy: Always
